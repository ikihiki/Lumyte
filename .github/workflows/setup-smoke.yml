name: Setup smoke test

on:
  push:
    branches: [main]
    paths:
      - 'tools/setup/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'global.json'
      - 'NuGet.config'
      - '.devcontainer/**'
      - '.github/workflows/setup-smoke.yml'
  pull_request:
    paths:
      - 'tools/setup/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'global.json'
      - 'NuGet.config'
      - '.devcontainer/**'
      - '.github/workflows/setup-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-smoke:
    name: Setup and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/setup/setup.sh

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\setup\setup.ps1

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          mise run verify

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'lumyte-smoke.log'
          try {
            & {
              .\tools\setup\ci-windows-smoke.ps1
            } *>&1 | Tee-Object -FilePath $log
          } catch {
            $details = $_.ToString()
            if (Test-Path $log) {
              $details += "`n" + ((Get-Content $log -Tail 60) -join "`n")
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows smoke test failed::$details"
            exit 1
          }
