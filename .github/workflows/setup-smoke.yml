name: Setup smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup-smoke:
    name: Setup and smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/setup/setup.sh

      - name: Setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\setup\setup.ps1

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          mise run verify

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . .\tools\setup\activate.ps1 -RequireCompiler
          mise run verify
