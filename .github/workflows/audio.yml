name: Audio backends

on:
  pull_request:
    paths:
      - 'src/Audio/**'
      - 'tests/Audio/**'
      - 'samples/Lumyte.Audio.*/**'
      - 'tools/audio/**'
      - '.github/workflows/audio.yml'
      - 'Directory.Build.props'
      - 'global.json'
  push:
    branches: [main]
    paths:
      - 'src/Audio/**'
      - 'tests/Audio/**'
      - 'samples/Lumyte.Audio.*/**'
      - 'tools/audio/**'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Install tools
        run: |
          bash tools/setup/setup.sh
          sudo apt-get update
          sudo apt-get install -y libopenal1
          python3 -m venv /tmp/audio-playwright
          /tmp/audio-playwright/bin/pip install playwright==1.58.0
          /tmp/audio-playwright/bin/playwright install --with-deps chromium
      - name: Run OpenAL and Browser contracts
        run: |
          source tools/setup/activate.sh
          mkdir -p artifacts/nuget
          ALSOFT_DRIVERS=null dotnet run --project samples/Lumyte.Audio.Sample -c Release
          LUMYTE_OPENAL_TESTS=1 ALSOFT_DRIVERS=null dotnet test tests/Audio/Lumyte.Audio.OpenAL.Tests -c Release
          dotnet workload install wasm-tools
          dotnet publish samples/Lumyte.Audio.Browser.Sample -c Release -o artifacts/audio-browser
          /tmp/audio-playwright/bin/python tools/audio/verify_browser.py artifacts/audio-browser/wwwroot
      - name: Pack audio libraries
        run: |
          source tools/setup/activate.sh
          dotnet pack src/Audio/Lumyte.Audio.Abstractions -c Release -o artifacts/nuget
          dotnet pack src/Audio/Lumyte.Audio.OpenAL -c Release -o artifacts/nuget
          dotnet pack src/Audio/Lumyte.Audio.Browser -c Release -o artifacts/nuget
