name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Build and run tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.10.3'
          install_args: '--locked'
      - name: Build solution
        shell: bash
        run: |
          export DOTNET_ROOT="$(mise where http:dotnet)"
          mkdir -p artifacts/nuget
          mise exec -- dotnet build Lumyte.slnx -c Release
      - name: Run solution tests
        shell: bash
        run: |
          export DOTNET_ROOT="$(mise where http:dotnet)"
          mise exec -- dotnet test Lumyte.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
      - name: Sample, pack and lint
        shell: bash
        run: |
          export DOTNET_ROOT="$(mise where http:dotnet)"
          mise exec -- dotnet run --project samples/Lumyte.Composition.Sample -c Release --no-build
          mise exec -- dotnet pack src/Core/Lumyte.Composition -c Release --no-build -o artifacts/nuget
          mise exec -- dotnet pack src/Core/Lumyte.Composition.Generators -c Release --no-build -o artifacts/nuget
          mise exec -- dotnet build Lumyte.slnx --no-restore
          mise exec -- dotnet format Lumyte.slnx --no-restore --verify-no-changes
          mise run check-markdown
