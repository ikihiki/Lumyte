name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Linux DXC libraries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            artifacts/dev-env/dxc/lib
            artifacts/dev-env/dxc/version.txt
            artifacts/dev-env/dxc/LICENSE.TXT
          key: dxc-v1.8.2505.1-${{ runner.os }}-${{ matrix.arch }}-v2

      - name: Mise setup (Linux)
        shell: bash
        run: bash tools/setup/setup.sh

      - name: Prepare Linux validation dependencies
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenal1

      - name: Build solution (Linux)
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target Compile --configuration Release --host-only

      - name: Run solution tests (Linux)
        shell: bash
        run: |
          source tools/setup/activate.sh
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            export LUMYTE_GRAPHICS_GPU_TESTS=1
            export VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD"
            export LUMYTE_OPENAL_TESTS=1
            export ALSOFT_DRIVERS=null
          fi
          dotnet run --project build -c Release --no-build --no-restore -- --target CiNative --configuration Release --host-only --no-build --no-restore
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            dotnet run --project build -c Release --no-build --no-restore -- --target PipelineBenchmark --configuration Release --no-build --no-restore
          fi

      - name: Upload native Parley package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/text-parley/package/
          if-no-files-found: error
          retention-days: 7

      # The native job supplies the desktop P/Invoke assembly for packaging.
      - name: Upload managed Parley package assets
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-managed
          path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 7

      - name: Native / X11 windowing
        shell: bash
        run: |
          source tools/setup/activate.sh
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          dotnet run --project build -c Release --no-build --no-restore -- --target TestWindowing --configuration Release --no-build --no-restore

      - name: Distribution / samples, AOT and packages
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target CiDistribution --configuration Release --host-only --no-build --no-restore --skip-parley-package

      - name: Quality / format and lint
        if: matrix.arch == 'x64'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target CiQuality --host-only

      - name: Verify diagnostic server and game processes
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target TestDiagnosticsProcesses --configuration Release --no-build --no-restore

      - name: Verify server-hosted diagnostic UI
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target TestDiagnosticsUi --configuration Release --no-build --no-restore

      - name: Generate diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          PREVIEW_COMMIT: ${{ github.sha }}
          PREVIEW_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_LABEL: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target DiagnosticGallery

      - name: Upload diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-gallery
          path: artifacts/diagnostics-gallery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/test-results/
          if-no-files-found: ignore

  windows:
    name: Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Mise setup (Windows)
        shell: powershell
        run: |
          .\tools\setup\setup.ps1
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('build', 'build', '-c', 'Release')

      - name: Build solution (Windows)
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'Compile', '--configuration', 'Release', '--host-only')

      - name: Run solution tests (Windows)
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'CiNative', '--configuration', 'Release', '--host-only', '--no-build', '--no-restore')

      - name: Upload native Parley package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/text-parley/package/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Distribution / Windows window sample
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'PublishWindowSample', '--configuration', 'Release', '--no-build', '--no-restore')

      - name: Distribution / Windows packages
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          foreach ($project in @('src/Platform/Lumyte.Platform.Windows', 'src/Graphics/Lumyte.Graphics.Direct3D12')) {
            Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'Pack', '--project', $project, '--configuration', 'Release', '--no-build', '--no-restore')
          }

      - name: Quality / Windows format
        if: matrix.arch == 'x64'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'CheckFormat', '--host-only')

  browser:
    name: Browser (Linux x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Cache Linux DXC libraries
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            artifacts/dev-env/dxc/lib
            artifacts/dev-env/dxc/version.txt
            artifacts/dev-env/dxc/LICENSE.TXT
          key: dxc-v1.8.2505.1-${{ runner.os }}-x64-v2

      - name: Mise setup (Browser)
        run: bash tools/setup/setup.sh

      - name: Browser / contracts, WebGPU and audio
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release --no-build --no-restore -- --target CiBrowser --configuration Release

      - name: Upload browser results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-browser
          path: artifacts/test-results/
          if-no-files-found: ignore

  package:
    name: Parley native NuGet package
    needs: [linux, windows, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Collect all native runtime assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: parley-native-*
          merge-multiple: true
          path: artifacts/text-parley/package/

      - name: Restore managed package outputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: parley-managed
          path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/

      - name: Restore package metadata
        run: |
          # NuGet.config registers the local feed; it must exist before dotnet run restores the runner.
          mkdir -p artifacts/nuget
          dotnet run --project build -c Release -- --target Restore --project src/Graphics/Lumyte.Graphics.Text.Parley

      - name: Package validated runtime assets
        run: dotnet run --project build -c Release --no-build --no-restore -- --target Pack --project src/Graphics/Lumyte.Graphics.Text.Parley --configuration Release --no-build --no-restore

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30
