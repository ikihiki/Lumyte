    needs:
    - aot-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: prebuilt-aot-linux-x64
        path: ${{ runner.temp }}/prebuilt
    - name: Verify and extract immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        python tools/ci/prebuilt.py extract "$RUNNER_TEMP/prebuilt/aot-linux-x64.tar.gz" --kind aot --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - name: Provision tools and runtime only (no product compilation)
      shell: bash
      run: |
        LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        bash tools/setup/install-ci-runtime.sh aot
        python tools/ci/prebuilt.py verify "$RUNNER_TEMP/prebuilt/aot-linux-x64.tar.gz" --kind aot --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages" --check-runtime
    - name: Execute prebuilt AOT outputs
      run: |-
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --suite aot --aot-group balanced-2 --configuration Release --host-only --no-build --no-restore
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-aot-balanced-2
        path: artifacts/test-results/
        if-no-files-found: ignore
        overwrite: true
    env:
      LUMYTE_PREBUILT_CONSUMER: '1'
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
  package:
    name: Parley native NuGet package
    needs:
    - integration-linux-x64
    - cpu-linux-x64
    - gpu-linux-x64
    - quality-linux-x64
    - integration-linux-arm64
    - integration-windows-x64
    - quality-windows-x64
    - integration-windows-arm64
    - browser-graphics
    - browser-text
    - browser-ui-application
    - browser-ui-navigation
    - browser-ui-pages
    - browser-ui-transitions
    - browser-audio
    - aot-balanced-1
    - aot-balanced-2
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - name: Collect all native runtime assets
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        pattern: parley-native-*
        merge-multiple: true
        path: artifacts/text-parley/package/
    - name: Restore managed package outputs
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: parley-managed
        path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/
    - name: Package validated runtime assets
      run: |
        # NuGet.config registers the local feed; it must exist before dotnet run restores the runner.
        mkdir -p artifacts/nuget
        dotnet run --project build -c Release -- --target Distribution --distribution-output packages --project src/Graphics/Lumyte.Graphics.Text.Parley --no-build --restore-metadata
    - name: Upload package
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: parley-nuget
        path: artifacts/nuget/*.nupkg
        if-no-files-found: error
        retention-days: 30
        overwrite: true
'on':
  push:
    branches:
    - main
  pull_request: null
  workflow_dispatch: null
