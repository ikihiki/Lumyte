      env:
        CHROME: ${{ steps.chrome.outputs.chrome-path }}
        LUMYTE_REQUIRE_SOFTWARE_WEBGPU: '1'
        LUMYTE_BROWSER_FLIGHT_RECORDER: '1'
        LUMYTE_BROWSER_FLIGHT_RECORDER_SLOW_MS: '5000'
        LUMYTE_ALLOW_KNOWN_BROWSER_TIMEOUT: '1'
        LUMYTE_QUARANTINE_CONNECTED_PNG_TIMEOUT: '1'
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --lane integration --platform browser --configuration Release --browser-case graphics --no-build --no-restore
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-browser-graphics
