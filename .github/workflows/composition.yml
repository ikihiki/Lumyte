      uses: ./.github/actions/setup-linux
    - name: Publish all browser outputs once
      shell: bash
      run: |-
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Compile --build-kind browser --configuration Release --host-only
    - name: Seal immutable build outputs
      shell: bash
      run: |-
