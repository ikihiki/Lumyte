name: CI
permissions:
  contents: read
env:
  LUMYTE_CI_APT: '1'
  CARGO_HOME: ${{ github.workspace }}/artifacts/build/tools/cargo
  RUSTUP_HOME: ${{ github.workspace }}/artifacts/build/tools/rustup
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-build-linux-x64:
    name: Native build (linux-x64, Release)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - name: Cache dependencies
      uses: ./.github/actions/cache-dependencies
      with:
        profile: native
    - name: Mise setup (Linux)
      uses: ./.github/actions/setup-linux
    - name: Prepare Linux validation dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenal1
    - name: Restore native Cargo compilation
      uses: ./.github/actions/cache-native
    - name: Build solution (Linux)
      shell: bash
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Compile --configuration Release --host-only
    - name: Checkpoint verified native Cargo compilation
      uses: ./.github/actions/cache-native
      with:
        mode: save
    - name: Upload native Parley package assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: parley-native-Linux-x64
        path: artifacts/text-parley/package/
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Upload managed Parley package assets
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: parley-managed
        path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/
        if-no-files-found: error
        retention-days: 7
        overwrite: true
    - name: Seal immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        mkdir -p "$RUNNER_TEMP/prebuilt"
        python tools/ci/prebuilt.py create "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: prebuilt-native-linux-x64
        path: ${{ runner.temp }}/prebuilt/native-linux-x64.tar.gz
        if-no-files-found: error
        retention-days: 1
        overwrite: true
        compression-level: 0
    env:
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
  integration-linux-x64:
    name: Integration (linux-x64)
    needs:
    - native-build-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: prebuilt-native-linux-x64
        path: ${{ runner.temp }}/prebuilt
    - name: Verify and extract immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        python tools/ci/prebuilt.py extract "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - name: Provision tools and runtime only (no product compilation)
      shell: bash
      run: |
        LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        bash tools/setup/install-ci-runtime.sh native
        python tools/ci/prebuilt.py verify "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages" --check-runtime
    - name: Run integration tests (Linux)
      shell: bash
      run: |
        source tools/setup/activate.sh
        if [[ "x64" == 'x64' ]]; then
          export LUMYTE_OPENAL_TESTS=1
          export ALSOFT_DRIVERS=null
        fi
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --lane integration --configuration Release --host-only --no-build --no-restore
    - name: Host-side browser bridge contracts (Node mocks, no browser)
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --suite browser-contracts --no-build --no-restore
    - name: Native / X11 windowing
      shell: bash
      run: |
        source tools/setup/activate.sh
        if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
          bash tools/setup/install-ci-runtime.sh native
        fi
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --suite windowing --configuration Release --no-build --no-restore
    - name: Distribution / samples and packages
      shell: bash
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Distribution --configuration Release --host-only --no-build --no-restore --skip-parley-package --skip-wgpu-package
    - name: Verify diagnostic server and game processes
      shell: bash
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --suite diagnostics-processes --configuration Release --no-build --no-restore
    - name: Install pinned Chrome for diagnostic UI
      id: diagnostics-chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
      with:
        chrome-version: 156.0.8078.47
        install-dependencies: true
    - name: Verify server-hosted diagnostic UI
      shell: bash
      env:
        CHROME: ${{ steps.diagnostics-chrome.outputs.chrome-path }}
      run: |
        source tools/setup/activate.sh
        "$CHROME" --version
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --suite diagnostics-ui --configuration Release --no-build --no-restore
    - name: Generate diagnostic gallery
      shell: bash
      env:
        PREVIEW_COMMIT: ${{ github.sha }}
        PREVIEW_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        PREVIEW_LABEL: '${{ github.event_name == ''pull_request'' && format(''PR #{0}'', github.event.pull_request.number)
          || github.ref_name }}'
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Distribution --distribution-output diagnostic-gallery --no-build --no-restore
    - name: Upload diagnostic gallery
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: diagnostics-gallery
        path: artifacts/diagnostics-gallery/
        if-no-files-found: error
        retention-days: 30
        overwrite: true
    - name: Upload test results
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-Linux-x64
        path: artifacts/test-results/
        if-no-files-found: ignore
        overwrite: true
      if: always()
    env:
      LUMYTE_PREBUILT_CONSUMER: '1'
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
  cpu-linux-x64:
    name: Cpu (linux-x64)
    needs:
    - native-build-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: prebuilt-native-linux-x64
        path: ${{ runner.temp }}/prebuilt
    - name: Verify and extract immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        python tools/ci/prebuilt.py extract "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - name: Provision tools and runtime only (no product compilation)
      shell: bash
      run: |
        LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        bash tools/setup/install-ci-runtime.sh native
        python tools/ci/prebuilt.py verify "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages" --check-runtime
    - name: Run CPU tests
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --lane cpu --host-only --test-concurrency 4 --no-build --no-restore
    - name: Upload cpu results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-cpu-linux-x64
        path: artifacts/test-results/
        if-no-files-found: ignore
        overwrite: true
    env:
      LUMYTE_PREBUILT_CONSUMER: '1'
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
  gpu-linux-x64:
    name: Gpu (linux-x64)
    needs:
    - native-build-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: prebuilt-native-linux-x64
        path: ${{ runner.temp }}/prebuilt
    - name: Verify and extract immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        python tools/ci/prebuilt.py extract "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - name: Provision tools and runtime only (no product compilation)
      shell: bash
      run: |
        LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        bash tools/setup/install-ci-runtime.sh native
        python tools/ci/prebuilt.py verify "$RUNNER_TEMP/prebuilt/native-linux-x64.tar.gz" --kind native --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages" --check-runtime
    - name: Native / cold-cache maximum drawing program
      shell: bash
      run: |
        source tools/setup/activate.sh
        export LUMYTE_GRAPHICS_GPU_TESTS=1
        export VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD"
        # A unique empty driver cache prevents a previous shader binary from hiding the regression.
        export MESA_SHADER_CACHE_DIR="$(mktemp -d "$RUNNER_TEMP/lumyte-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-XXXXXX")"
        dotnet test tests/Graphics/Lumyte.Graphics.Tests -c Release --no-build --no-restore --filter FullyQualifiedName~VulkanProgramCapacitiesAsync --logger "trx;LogFileName=graphics-cold-capacity.trx" --results-directory artifacts/test-results
    - name: Fingerprint software GPU compiler and driver
      id: gpu-cache
      shell: bash
      run: |
        source tools/setup/activate.sh
        # Driver closure changes invalidate every cached compiled shader.
        driver_hash=$(find /usr/lib/x86_64-linux-gnu -maxdepth 1 -type f \( -name 'libvulkan*' -o -name 'libLLVM*' -o -name 'libgallium*' \) -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
        echo "driver=$driver_hash" >> "$GITHUB_OUTPUT"
        source_hash=$(git ls-files -z -- src tests native build tools .github global.json mise.toml mise.lock Directory.Build.props | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f 1)
        echo "source=$source_hash" >> "$GITHUB_OUTPUT"
        dpkg-query -W > artifacts/gpu-package-versions.txt
        package_hash=$(sha256sum artifacts/gpu-package-versions.txt | cut -d ' ' -f 1)
        echo "packages=$package_hash" >> "$GITHUB_OUTPUT"
        slangc -version
        VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD" vulkaninfo --summary
    - name: Cache ordinary GPU compiled shaders
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
      with:
        path: artifacts/dev-env/mesa-cache
        key: gpu-shaders-v1-ubuntu24-${{ runner.arch }}-${{ steps.gpu-cache.outputs.driver }}-${{ steps.gpu-cache.outputs.packages
          }}-${{ steps.gpu-cache.outputs.source }}
    - name: GPU backend and pixel contracts
      run: |
        source tools/setup/activate.sh
        export LUMYTE_GRAPHICS_GPU_TESTS=1
        export VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD"
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --lane gpu --host-only --no-build --no-restore --pipeline-validation
    - name: Upload gpu results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-gpu-linux-x64
        path: artifacts/test-results/
        if-no-files-found: ignore
        overwrite: true
    env:
      LUMYTE_PREBUILT_CONSUMER: '1'
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
  quality-linux-x64:
    name: Quality (linux-x64)
    needs:
    - native-build-linux-x64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
