  aot-build:
    name: Aot publish (one shared workspace)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - name: Cache dependencies
      uses: ./.github/actions/cache-dependencies
      with:
        profile: native
    - name: Mise setup (AOT)
      uses: ./.github/actions/setup-linux
    - name: Publish all aot outputs once
      shell: bash
      run: |-
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Compile --build-kind aot --configuration Release --host-only
    - name: Seal immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        mkdir -p "$RUNNER_TEMP/prebuilt"
        python tools/ci/prebuilt.py create "$RUNNER_TEMP/prebuilt/aot-linux-x64.tar.gz" --kind aot --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: prebuilt-aot-linux-x64
        path: ${{ runner.temp }}/prebuilt/aot-linux-x64.tar.gz
        if-no-files-found: error
        retention-days: 1
        overwrite: true
        compression-level: 0
    env:
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
