name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: aarch64
          - os: windows-2022
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Mise setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/setup/setup.sh

      - name: Mise setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\setup\setup.ps1

      - name: Verify environment (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target VerifyEnvironment

      - name: Verify environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'lumyte-smoke.log'
          try {
            & {
              .\tools\setup\ci-windows-smoke.ps1
            } *>&1 | Tee-Object -FilePath $log
          } catch {
            $details = $_.ToString()
            if (Test-Path $log) {
              $details += "`n" + ((Get-Content $log -Tail 60) -join "`n")
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows environment verification failed::$details"
            exit 1
          }

      - name: Prepare Linux validation dependencies
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenal1

      - name: Build solution (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target Compile --configuration Release

      - name: Build solution (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--', '--target', 'Compile', '--configuration', 'Release')

      - name: Run solution tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            export LUMYTE_GRAPHICS_GPU_TESTS=1
            export VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD"
            export LUMYTE_OPENAL_TESTS=1
            export ALSOFT_DRIVERS=null
          fi
          dotnet run --project build -c Release -- --target Test --configuration Release --no-build --no-restore
          dotnet run --project build -c Release -- --target TestBrowserContracts
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            dotnet run --project build -c Release -- --target PipelineBenchmark --configuration Release --no-build --no-restore
          fi

      - name: Run solution tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--', '--target', 'Test', '--configuration', 'Release', '--no-build', '--no-restore')

      - name: Upload native Parley package assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/text-parley/package/
          if-no-files-found: error
          retention-days: 7

      # Capture the native P/Invoke assembly before a Browser build selects its static module.
      - name: Upload managed Parley package assets
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-managed
          path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/
          if-no-files-found: error
          retention-days: 7

      - name: Run X11 and browser Windowing tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y xvfb xauth
          fi
          dotnet run --project build -c Release -- --target TestWindowing --configuration Release --no-build --no-restore

      - name: Run Wasm and browser WebGPU tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target TestWasm --configuration Release

      - name: Run browser audio contracts
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target TestBrowserAudio --configuration Release

      - name: Verify diagnostic server and game processes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target TestDiagnosticsProcesses --configuration Release --no-build --no-restore

      - name: Verify server-hosted diagnostic UI
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target TestDiagnosticsUi --configuration Release --no-build --no-restore

      - name: Generate diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          PREVIEW_COMMIT: ${{ github.sha }}
          PREVIEW_HEAD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_LABEL: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target DiagnosticGallery

      - name: Upload diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-gallery
          path: artifacts/diagnostics-gallery/
          if-no-files-found: error
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Sample, pack and lint
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project build -c Release -- --target Samples --configuration Release --no-build --no-restore
          dotnet run --project build -c Release -- --target TestAot --configuration Release --no-build --no-restore
          dotnet run --project build -c Release -- --target Pack --configuration Release --no-build --no-restore --skip-parley-package
          dotnet run --project build -c Release -- --target PublishWindowSample --configuration Release --no-build --no-restore
          dotnet run --project build -c Release -- --target Compile --configuration Debug --no-restore
          dotnet run --project build -c Release -- --target CheckFormat --configuration Debug --no-restore
          dotnet run --project build -c Release -- --target CheckMarkdown

  package:
    name: Parley native NuGet package
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Collect all native runtime assets
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: parley-native-*
          merge-multiple: true
          path: artifacts/text-parley/package/

      - name: Restore managed package outputs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: parley-managed
          path: src/Graphics/Lumyte.Graphics.Text.Parley/bin/Release/net10.0/

      - name: Restore package metadata
        run: dotnet run --project build -c Release -- --target Restore --project src/Graphics/Lumyte.Graphics.Text.Parley

      - name: Package validated runtime assets
        run: dotnet run --project build -c Release -- --target Pack --project src/Graphics/Lumyte.Graphics.Text.Parley --configuration Release --no-build --no-restore

      - name: Upload package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: parley-nuget
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30
