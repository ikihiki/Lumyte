      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
  native-build-windows-x64:
    name: Native build (win-x64, Release)
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - name: Cache dependencies
      uses: ./.github/actions/cache-dependencies
      with:
        profile: native
    - name: Mise setup (Windows)
      shell: powershell
      run: |
