  browser-ui-application:
    name: Browser (ui-application)
    needs:
    - browser-build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
    - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        global-json-file: global.json
    - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
      with:
        name: prebuilt-browser-linux-x64
        path: ${{ runner.temp }}/prebuilt
    - name: Verify and extract immutable build outputs
      shell: bash
      run: |-
        test "$(dotnet --version)" = 10.0.403
        python tools/ci/prebuilt.py extract "$RUNNER_TEMP/prebuilt/browser-linux-x64.tar.gz" --kind browser --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
    - name: Provision tools and runtime only (no product compilation)
      shell: bash
      run: |
        LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        bash tools/setup/install-ci-runtime.sh browser
        python tools/ci/prebuilt.py verify "$RUNNER_TEMP/prebuilt/browser-linux-x64.tar.gz" --kind browser --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages" --check-runtime
    - name: Install pinned Chrome with bundled SwiftShader
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
      with:
        chrome-version: 156.0.8078.47
        install-dependencies: true
    - name: Prepare browser runtime dependencies
      env:
        CHROME: ${{ steps.chrome.outputs.chrome-path }}
      run: |
        source tools/setup/environment.sh
        source /etc/os-release
        source tools/setup/ci-apt.sh
        sudo apt-get "${lumyte_apt_options[@]}" update
        sudo apt-get "${lumyte_apt_options[@]}" install -y libopenal1
        "$CHROME" --version
        # Fail before publishing if this browser has no matching software driver.
        chrome_directory=$(dirname "$(readlink -f "$CHROME")")
        test -s "$chrome_directory/libvk_swiftshader.so"
        test -s "$chrome_directory/vk_swiftshader_icd.json"
        test -s "$chrome_directory/libvulkan.so.1"
    - name: Browser / platform API integration
      env:
        CHROME: ${{ steps.chrome.outputs.chrome-path }}
        LUMYTE_REQUIRE_SOFTWARE_WEBGPU: '1'
        LUMYTE_BROWSER_FLIGHT_RECORDER: '1'
        LUMYTE_BROWSER_FLIGHT_RECORDER_SLOW_MS: '5000'
        LUMYTE_ALLOW_KNOWN_BROWSER_TIMEOUT: '1'
        LUMYTE_QUARANTINE_CONNECTED_PNG_TIMEOUT: '1'
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target Test --lane integration --platform browser --configuration Release --browser-case ui-application --no-build --no-restore
    - name: Upload results
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: test-results-browser-ui-application
        path: artifacts/test-results/
        if-no-files-found: ignore
        overwrite: true
    env:
      LUMYTE_PREBUILT_CONSUMER: '1'
      LUMYTE_PREBUILT_SDK_ROOT: ${{ github.workspace }}/artifacts/dev-env/mise/data/installs/http-dotnet/10.0.403
      LumyteBuildParleyNative: 'false'
      LumyteBuildWgpuNative: 'false'
      LumyteBuildUsvgNative: 'false'
      LUMYTE_PREBUILT_ROOT: ${{ github.workspace }}
