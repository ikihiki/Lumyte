name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: ${{ matrix.platform }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: Linux
            arch: aarch64
          - os: windows-2022
            platform: Windows
            arch: x64
          - os: windows-11-arm
            platform: Windows
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Mise setup (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash tools/setup/setup.sh

      - name: Mise setup (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\tools\setup\setup.ps1

      - name: Verify environment (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          mise run verify

      - name: Verify environment (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'lumyte-smoke.log'
          try {
            & {
              .\tools\setup\ci-windows-smoke.ps1
            } *>&1 | Tee-Object -FilePath $log
          } catch {
            $details = $_.ToString()
            if (Test-Path $log) {
              $details += "`n" + ((Get-Content $log -Tail 60) -join "`n")
            }
            $details = $details.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Host "::error title=Windows environment verification failed::$details"
            exit 1
          }

      - name: Build solution (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet build Lumyte.slnx -c Release

      - name: Build solution (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('build', 'Lumyte.slnx', '-c', 'Release')

      - name: Run solution tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            export LUMYTE_GRAPHICS_GPU_TESTS=1
            export VK_DRIVER_FILES="$LUMYTE_LAVAPIPE_ICD"
          fi
          dotnet test Lumyte.slnx -c Release --no-build --no-restore --logger trx --results-directory artifacts/test-results
          if [[ "${{ matrix.arch }}" == 'x64' ]]; then
            dotnet run --project samples/Lumyte.Graphics.DeviceCaps.Sample -c Release --no-build -- vulkan pipeline-benchmark | tee artifacts/test-results/vulkan-pipeline-benchmark.jsonl
          fi

      - name: Run solution tests (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          . ./tools/setup/activate.ps1
          Invoke-LumyteCommand dotnet @('test', 'Lumyte.slnx', '-c', 'Release', '--no-build', '--no-restore',
            '--logger', 'trx', '--results-directory', 'artifacts/test-results')

      - name: Run Wasm and browser WebGPU tests
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          mise run test-wasm 2>&1 | tee artifacts/test-results/browser-webgpu.log

      - name: Verify diagnostic server and game processes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          source tools/setup/activate.sh
          python3 tools/diagnostics/communication-smoke.py --output artifacts/test-results/diagnostics-communication/processes

      - name: Verify server-hosted diagnostic UI
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          CHROME: /usr/bin/google-chrome
        run: |
          source tools/setup/activate.sh
          dotnet publish src/Diagnostics/Lumyte.Diagnostics.Server -c Release --no-build --no-restore -o artifacts/diagnostics-ui-server
          node tools/diagnostics/verify-browser.mjs

      - name: Generate diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        env:
          PREVIEW_COMMIT: ${{ github.sha }}
          PREVIEW_LABEL: "${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || github.ref_name }}"
        run: |
          source tools/setup/activate.sh
          node tools/diagnostics/generate-gallery.test.mjs
          node tools/diagnostics/generate-gallery.mjs artifacts/test-results/diagnostics-ui artifacts/diagnostics-gallery

      - name: Upload diagnostic gallery
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: diagnostics-gallery
          path: artifacts/diagnostics-gallery/
          if-no-files-found: error
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifacts/test-results/
          if-no-files-found: ignore

      - name: Sample, pack and lint
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          source tools/setup/activate.sh
          dotnet run --project samples/Lumyte.Composition.Sample -c Release --no-build
          dotnet run --project samples/Lumyte.Diagnostics.Sample -c Release --no-build
          dotnet run --project samples/Lumyte.Animation.Sample -c Release --no-build
          dotnet run --project samples/Lumyte.StateMachines.Sample -c Release --no-build
          dotnet run --project samples/Lumyte.Animation.StateMachine.Sample -c Release --no-build
          dotnet pack src/Core/Lumyte.Settings -c Release --no-build -o artifacts/nuget
          dotnet pack src/Core/Lumyte.Core -c Release --no-build -o artifacts/nuget
          dotnet pack src/Core/Lumyte.Composition -c Release --no-build -o artifacts/nuget
          dotnet pack src/Core/Lumyte.Composition.Generators -c Release --no-build -o artifacts/nuget
          dotnet pack src/Core/Lumyte.StateMachines -c Release --no-build -o artifacts/nuget
          dotnet pack src/Animation/Lumyte.Animation -c Release --no-build -o artifacts/nuget
          dotnet pack src/Platform/Lumyte.Input -c Release --no-build -o artifacts/nuget
          dotnet pack src/Diagnostics/Lumyte.Diagnostics -c Release --no-build -o artifacts/nuget
          dotnet pack src/Diagnostics/Lumyte.Diagnostics.Settings -c Release --no-build -o artifacts/nuget
          dotnet pack src/Diagnostics/Lumyte.Diagnostics.Generators -c Release --no-build -o artifacts/nuget
          dotnet build Lumyte.slnx --no-restore
          dotnet format Lumyte.slnx --no-restore --verify-no-changes
          mise run check-markdown

  publish-pages:
    name: Publish diagnostic gallery
    needs: validate
    if: >-
      github.repository == 'ikihiki/Lumyte' &&
      (github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' && github.event.pull_request.number == 26 &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: diagnostics-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify current revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            actual=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          else
            actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          fi
          if [ "$actual" = "$EXPECTED_HEAD" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipped a superseded source revision.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        if: steps.current.outputs.publish == 'true'
        with:
          name: diagnostics-gallery
          path: incoming

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.current.outputs.publish == 'true'
        with:
          path: incoming

      - name: Deploy GitHub Pages
        if: steps.current.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Link preview
        if: steps.current.outputs.publish == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '[画面プレビューを見る](%s)\n' "$PAGE_URL" >> "$GITHUB_STEP_SUMMARY"
