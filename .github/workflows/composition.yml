        source tools/setup/activate.sh
        test "$DOTNET_ROOT" = "$LUMYTE_PREBUILT_SDK_ROOT"
        mkdir -p "$RUNNER_TEMP/prebuilt"
        python tools/ci/prebuilt.py create "$RUNNER_TEMP/prebuilt/browser-linux-x64.tar.gz" --kind browser --rid linux-x64 --configuration Release --sdk 10.0.403 --nuget-root "$GITHUB_WORKSPACE/artifacts/dev-env/nuget-packages"
