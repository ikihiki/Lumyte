name: Component performance screening

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-screening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  screening:
    name: Advisory CPU component screening
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Bootstrap local feed
        run: mkdir -p artifacts/nuget

      - name: Cache downloaded NuGet packages
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.nuget/packages
          key: component-nuget-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('global.json', '**/*.csproj', '**/packages.lock.json') }}
          restore-keys: component-nuget-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Validate screening tooling
        run: dotnet test tests/Tools/Lumyte.Build.Tests -c Release --filter FullyQualifiedName~ComponentScreening

      - name: Select bounded component cases
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          dotnet run --project build -c Release --
          --target ComponentScreeningPlan --screening-base "$BASE_SHA" --screening-head "$HEAD_SHA"
          --screening-all ${{ github.event_name == 'workflow_dispatch' }} --output artifacts/component-screening

      - name: Measure base and head serially
        if: steps.plan.outputs.selected == 'true'
        run: >-
          dotnet run --project build -c Release --no-build --
          --target ComponentScreeningRun --screening-plan artifacts/component-screening/plan.json
          --output artifacts/component-screening --screening-timeout-seconds 900

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: component-screening
          path: |
            artifacts/component-screening/
            !artifacts/component-screening/scratch/**
          retention-days: 30
          if-no-files-found: warn
