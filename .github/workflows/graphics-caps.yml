name: Graphics device capabilities

on:
  push:
    branches: [main]
    paths:
      - 'src/Graphics/**'
      - 'samples/Graphics.Shared/**'
      - 'samples/Lumyte.Graphics.*/**'
      - 'tests/Graphics/**'
      - 'tools/graphics/**'
      - 'Directory.Build.*'
      - 'global.json'
      - 'NuGet.config'
      - '.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/graphics-caps.yml'
      - '!**/*.md'
  pull_request:
    paths:
      - 'src/Graphics/**'
      - 'samples/Graphics.Shared/**'
      - 'samples/Lumyte.Graphics.*/**'
      - 'tests/Graphics/**'
      - 'tools/graphics/**'
      - 'Directory.Build.*'
      - 'global.json'
      - 'NuGet.config'
      - '.editorconfig'
      - 'stylecop.json'
      - '.github/workflows/graphics-caps.yml'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphics-caps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.21.0'

      - name: Install software Vulkan driver
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers
          drivers=(/usr/share/vulkan/icd.d/lvp*.json)
          test -f "${drivers[0]}"
          echo "VK_DRIVER_FILES=${drivers[0]}" >> "$GITHUB_ENV"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          mkdir -p artifacts/nuget

      - name: Verify native devices through the common API
        env:
          LUMYTE_GRAPHICS_GPU_TESTS: '1'
        run: dotnet test tests/Graphics/Lumyte.Graphics.Tests -c Release --logger trx --results-directory artifacts/graphics-test-results

      - name: Install WebAssembly workload
        run: dotnet workload install wasm-tools

      - name: Publish browser sample
        run: dotnet publish samples/Lumyte.Graphics.Browser.Sample -c Release

      - name: Verify browser .NET and WebGPU
        env:
          CHROME: /usr/bin/google-chrome
        run: node tools/graphics/verify-browser.mjs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphics-test-results
          path: artifacts/graphics-test-results/*.trx
          if-no-files-found: ignore
