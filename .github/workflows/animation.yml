name: Animation

on:
  push:
    branches: [main]
    paths:
      - 'src/Animation/**'
      - 'src/Core/Lumyte.Core/**'
      - 'src/Core/Lumyte.Composition*/**'
      - 'tests/Animation/**'
      - 'samples/Lumyte.Animation.Sample/**'
      - 'docs/adr/animation/**'
      - 'Lumyte.slnx'
      - 'Directory.Build.props'
      - 'NuGet.config'
      - 'global.json'
      - 'mise.toml'
      - 'mise.lock'
      - '.editorconfig'
      - 'stylecop.json'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/animation.yml'
  pull_request:
    paths:
      - 'src/Animation/**'
      - 'src/Core/Lumyte.Core/**'
      - 'src/Core/Lumyte.Composition*/**'
      - 'tests/Animation/**'
      - 'samples/Lumyte.Animation.Sample/**'
      - 'docs/adr/animation/**'
      - 'Lumyte.slnx'
      - 'Directory.Build.props'
      - 'NuGet.config'
      - 'global.json'
      - 'mise.toml'
      - 'mise.lock'
      - '.editorconfig'
      - 'stylecop.json'
      - '.markdownlint-cli2.jsonc'
      - '.github/workflows/animation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: animation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  animation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.10.3'
          install_args: '--locked'
      - name: Build, test, sample, pack and lint
        shell: bash
        run: |
          export DOTNET_ROOT="$(mise where http:dotnet)"
          mkdir -p artifacts/nuget
          mise exec -- dotnet build Lumyte.slnx -c Release
          mise exec -- dotnet test Lumyte.slnx -c Release --no-build
          mise exec -- dotnet run --project samples/Lumyte.Animation.Sample -c Release --no-build
          mise exec -- dotnet pack src/Core/Lumyte.Core -c Release --no-build -o artifacts/nuget
          mise exec -- dotnet pack src/Animation/Lumyte.Animation -c Release --no-build -o artifacts/nuget
          mise exec -- dotnet build Lumyte.slnx --no-restore
          mise exec -- dotnet format Lumyte.slnx --no-restore --verify-no-changes
          mise run check-markdown
