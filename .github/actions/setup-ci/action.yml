name: Set up cached CI environment
description: Restore dependency and native build caches, then prepare the pinned development tools.

inputs:
  runner-image:
    description: Exact runs-on image label used by this job.
    required: true
  arch:
    description: Native architecture from the CI matrix.
    required: true

runs:
  using: composite
  steps:
    # These packages live under the repository, not the default user NuGet cache.
    # Exclude generated projects/imports so downloading build outputs cannot change the key.
    - name: Restore NuGet package cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: artifacts/dev-env/nuget-packages
        key: nuget-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'NuGet.config') }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '!**/bin/**', '!**/obj/**', '!artifacts/**') }}
        restore-keys: |
          nuget-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'NuGet.config') }}-

    # Installed tools are restored only for the same pinned tool/setup inputs.
    # Setup still recreates trust, shims, machine-specific manifests and OS dependencies.
    - name: Restore installed development tools
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise-bin
          artifacts/dev-env/mise/data/installs
        key: mise-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', '.mise/locks/**', 'tools/setup/*.sh', 'tools/setup/*.ps1', 'tools/setup/mise-bootstrap.json', 'build/Bootstrap/ReadMise.cs') }}

    - name: Restore vcpkg downloads and binary cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/vcpkg-downloads
          artifacts/dev-env/vcpkg-binary-cache
        key: vcpkg-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'tools/setup/smoke/vcpkg.json', 'tools/setup/setup-native.*', 'build/Build.Environment.cs') }}

    - name: Restore Linux DXC libraries
      if: runner.os == 'Linux'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/dxc/lib
          artifacts/dev-env/dxc/version.txt
          artifacts/dev-env/dxc/LICENSE.TXT
        key: dxc-v1.8.2505.1-${{ runner.os }}-${{ inputs.arch }}-v2

    # Cargo rechecks fingerprints after a compatible source fallback. Final build
    # outputs are transferred separately as artifacts, never selected by a cache hit.
    - name: Restore native Parley build cache
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: artifacts/text-parley/native/cargo
        key: parley-native-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'build/Build.Parley.cs', 'build/RustToolchain.cs', 'build/RustBootstrap.json', 'build/Targets/ParleyNative.targets', 'native/lumyte_text_parley/Cargo.toml', 'native/lumyte_text_parley/Cargo.lock', 'native/lumyte_text_parley/.cargo/**') }}-${{ hashFiles('native/lumyte_text_parley/src/**', 'native/lumyte_text_parley/build.rs') }}
        restore-keys: |
          parley-native-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'build/Build.Parley.cs', 'build/RustToolchain.cs', 'build/RustBootstrap.json', 'build/Targets/ParleyNative.targets', 'native/lumyte_text_parley/Cargo.toml', 'native/lumyte_text_parley/Cargo.lock', 'native/lumyte_text_parley/.cargo/**') }}-

    - name: Mise setup (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: bash tools/setup/setup.sh

    - name: Mise setup (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: .\tools\setup\setup.ps1
