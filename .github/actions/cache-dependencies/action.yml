name: Cache CI dependencies
description: Reuse pinned toolchains and downloaded packages without sharing project build outputs.
inputs:
  profile:
    description: Separate native SDK installations from Browser workload installations.
    required: true
  mode:
    description: Restore normally, or checkpoint successfully prepared dependencies before tests.
    default: restore
runs:
  using: composite
  steps:
    - name: Cache Windows bootstrap dependencies
      if: inputs.mode == 'restore' && runner.os == 'Windows'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise-bin
          artifacts/dev-env/mesa-*
          artifacts/dev-env/vcpkg-downloads
        key: windows-bootstrap-v1-${{ runner.arch }}-${{ hashFiles('mise.toml', 'tools/setup/mise-bootstrap.json', 'tools/setup/setup-native.ps1') }}

    - name: Cache pinned toolchains
      if: inputs.mode == 'restore'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise/data/installs
        key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'tools/setup/mise-bootstrap.json') }}

    - name: Cache downloaded packages
      if: inputs.mode == 'restore'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/nuget-packages
          artifacts/build/tools/cargo/registry
          artifacts/build/tools/cargo/git
        key: packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'src/**/*.csproj', 'tests/**/*.csproj', 'samples/**/*.csproj', 'benchmarks/**/*.csproj', 'build/_build.csproj', 'build/packages.lock.json', 'native/**/Cargo.lock', 'Directory.Build.props', 'build/Directory.Build.props') }}
        restore-keys: |
          packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-
    - name: Checkpoint pinned toolchains
      if: inputs.mode == 'save'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise/data/installs
        key: tools-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'tools/setup/mise-bootstrap.json') }}

    - name: Cache verified Ubuntu package archives
      if: runner.os == 'Linux' && inputs.mode == 'restore'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: artifacts/dev-env/ci-apt/archives/*.deb
        key: apt-noble-v1-${{ runner.arch }}-${{ hashFiles('tools/setup/setup-os.sh', 'tools/setup/ci-apt.sh') }}
    - name: Cache verified Ubuntu package archives
      if: runner.os == 'Linux' && inputs.mode == 'save'
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: artifacts/dev-env/ci-apt/archives/*.deb
        key: apt-noble-v1-${{ runner.arch }}-${{ hashFiles('tools/setup/setup-os.sh', 'tools/setup/ci-apt.sh') }}
    - name: Cache pinned native helper toolchains
      if: inputs.mode == 'restore'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/build/tools/rustup
          artifacts/build/tools/cargo/bin
          artifacts/build/tools/python
        key: helper-tools-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.profile }}-${{ hashFiles('build/RustBootstrap.json', 'build/PythonRuntimes.json', 'build/Build.Parley.cs', 'build/Targets/ParleyNative.targets', 'build/Targets/ParleyBrowser.targets') }}
