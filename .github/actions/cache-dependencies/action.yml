name: Cache CI dependencies
description: Reuse pinned toolchains, downloaded packages and native build caches.
inputs:
  profile:
    description: Separate native SDK installations from Browser workload installations.
    required: true
  runner-image:
    description: Exact runs-on image label used by this job.
    required: false
    default: ${{ runner.os }}
  arch:
    description: Native architecture from the CI matrix.
    required: false
    default: ${{ runner.arch }}
runs:
  using: composite
  steps:
    - name: Cache Windows bootstrap dependencies
      if: runner.os == 'Windows'
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise-bin
          artifacts/dev-env/mesa-*
          artifacts/dev-env/vcpkg-downloads
        key: windows-bootstrap-v2-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('mise.toml', 'tools/setup/mise-bootstrap.json', 'tools/setup/setup-native.ps1') }}

    # Keep Browser workloads separate, and never restore installed tools from a
    # different tool/setup definition. Setup still prepares machine-specific state.
    - name: Cache pinned toolchains
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/mise/data/installs
          artifacts/build/tools/rustup
          artifacts/build/tools/cargo/bin
          artifacts/build/tools/python
        key: tools-v2-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', '.mise/locks/**', 'tools/setup/*.sh', 'tools/setup/*.ps1', 'tools/setup/mise-bootstrap.json', 'build/Bootstrap/ReadMise.cs', 'build/RustBootstrap.json', 'build/PythonRuntimes.json', 'build/RustToolchain.cs', 'build/PythonRuntime.cs', 'build/Build.Parley.cs', 'build/Targets/ParleyNative.targets', 'build/Targets/ParleyBrowser.targets') }}

    # NuGet uses this repository-local path. Exclude generated metadata so
    # downloading a compiled artifact cannot change the dependency cache key.
    - name: Cache downloaded packages
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/nuget-packages
          artifacts/build/tools/cargo/registry
          artifacts/build/tools/cargo/git
        key: packages-v2-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'NuGet.config') }}-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'native/**/Cargo.lock', '!**/bin/**', '!**/obj/**', '!artifacts/**') }}
        restore-keys: |
          packages-v2-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ inputs.profile }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'NuGet.config') }}-

    # Windows downloads are already owned by the bootstrap cache above.
    - name: Cache vcpkg binaries and Linux downloads
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/vcpkg-binary-cache
          ${{ runner.os == 'Linux' && 'artifacts/dev-env/vcpkg-downloads' || '' }}
        key: vcpkg-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('mise.toml', 'mise.lock', 'tools/setup/smoke/vcpkg.json', 'tools/setup/setup-native.*', 'build/Build.Environment.cs') }}

    # Cargo validates fingerprints after a compatible source fallback. The
    # compiled solution is passed to downstream jobs separately as an artifact.
    - name: Cache native Parley build outputs
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: artifacts/text-parley/native/cargo
        key: parley-native-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'build/Build.Parley.cs', 'build/RustToolchain.cs', 'build/RustBootstrap.json', 'build/Targets/ParleyNative.targets', 'native/lumyte_text_parley/Cargo.toml', 'native/lumyte_text_parley/Cargo.lock', 'native/lumyte_text_parley/.cargo/**') }}-${{ hashFiles('native/lumyte_text_parley/src/**', 'native/lumyte_text_parley/build.rs') }}
        restore-keys: |
          parley-native-v1-${{ runner.os }}-${{ inputs.runner-image }}-${{ inputs.arch }}-${{ hashFiles('global.json', 'mise.toml', 'mise.lock', 'build/Build.Parley.cs', 'build/RustToolchain.cs', 'build/RustBootstrap.json', 'build/Targets/ParleyNative.targets', 'native/lumyte_text_parley/Cargo.toml', 'native/lumyte_text_parley/Cargo.lock', 'native/lumyte_text_parley/.cargo/**') }}-
