name: Prepare Linux with verified DXC checkpoint
description: Provision actual tools before restoring DXC; checkpoint verified libraries before other native setup.
runs:
  using: composite
  steps:
    - name: Provision OS and pinned tools
      shell: bash
      run: LUMYTE_SETUP_TOOLS_ONLY=1 bash tools/setup/setup.sh
    - name: Restore installed DXC candidate
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/dxc/lib
          artifacts/dev-env/dxc/LICENSE.TXT
          artifacts/dev-env/dxc/provenance.json
        key: dxc-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/Build.Dxc.cs', 'build/DxcCache.cs', 'tools/setup/dxc-compiler-options.cmake', 'mise.toml', 'mise.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          dxc-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/Build.Dxc.cs', 'build/DxcCache.cs', 'tools/setup/dxc-compiler-options.cmake', 'mise.toml', 'mise.lock') }}-
    - name: Verify or build DXC using installed compiler
      shell: bash
      run: |
        source tools/setup/activate.sh
        dotnet run --project build -c Release -- --target Setup --setup-tool dxc
    - name: Checkpoint verified DXC before remaining setup
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          artifacts/dev-env/dxc/lib
          artifacts/dev-env/dxc/LICENSE.TXT
          artifacts/dev-env/dxc/provenance.json
        key: dxc-v3-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/Build.Dxc.cs', 'build/DxcCache.cs', 'tools/setup/dxc-compiler-options.cmake', 'mise.toml', 'mise.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Complete native setup and SDK verification
      shell: bash
      run: |
        source tools/setup/activate.sh
        LUMYTE_DXC_CHECKPOINT_READY=1 mise run setup-native
        dotnet run --project build -c Release --no-build --no-restore -- --target Verify --verify-scope sdk
