name: Restore compiled CI solution
description: Download this run's outputs and restore NuGet dependencies without recompiling.
inputs:
  runner-image:
    description: Exact runner label used by the build job.
    required: true
  arch:
    description: Architecture used by the build job.
    required: true
runs:
  using: composite
  steps:
    - name: Download compiled solution
      uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
      with:
        name: build-${{ inputs.runner-image }}-${{ inputs.arch }}-Release
        path: artifacts/ci/

    # tar preserves apphost execute permissions, unlike individual artifact files.
    - name: Extract and restore dependencies (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        tar -xf artifacts/ci/build.tar
        source tools/setup/activate.sh
        dotnet run --project build -c Release --no-build --no-restore -- --target VerifyCiBuild --configuration Release --host-only
        # A cache miss must remain correct: recover packages referenced by obj files.
        dotnet run --project build -c Release --no-build --no-restore -- --target Restore --host-only

    - name: Extract and restore dependencies (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        . ./tools/setup/activate.ps1
        Invoke-LumyteCommand tar @('-xf', 'artifacts/ci/build.tar')
        Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'VerifyCiBuild', '--configuration', 'Release', '--host-only')
        Invoke-LumyteCommand dotnet @('run', '--project', 'build', '-c', 'Release', '--no-build', '--no-restore', '--', '--target', 'Restore', '--host-only')
