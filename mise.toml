[settings]
lockfile = true

[vars]
vcpkg_commit = "9e593bb18ea69cc5095e012465dcd675a822ed0d"
windows_mesa_version = "26.2.4"
windows_mesa_sha256 = "351fc8c8b695878ffb3eaa044b3ead08672a48b1a045e3c3e3975811df0f6695"
windows_mesa_arm64_sha256 = "712f39e12e11fc8a3727a594377e5e4a7c8976731df0791726a889d2bb031bf8"

[env]
LUMYTE_ENV_ROOT = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}"
DOTNET_CLI_HOME = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/dotnet-home"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"
DOTNET_NOLOGO = "1"
NUGET_PACKAGES = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/nuget-packages"
VCPKG_ROOT = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/vcpkg"
VCPKG_DOWNLOADS = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/vcpkg-downloads"
VCPKG_DEFAULT_BINARY_CACHE = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/vcpkg-binary-cache"
VCPKG_DISABLE_METRICS = "1"
VCPKG_MAX_CONCURRENCY = "{{ env.VCPKG_MAX_CONCURRENCY | default(value='2') }}"
LUMYTE_NUGET_FEED = "{{ config_root }}/artifacts/nuget"
LUMYTE_LAVAPIPE_ICD = "{{ env.LUMYTE_ENV_ROOT | default(value=config_root ~ '/artifacts/dev-env') }}/lavapipe.json"
LUMYTE_VCPKG_COMMIT = "{{ vars.vcpkg_commit }}"
LUMYTE_WINDOWS_MESA_VERSION = "{{ vars.windows_mesa_version }}"
LUMYTE_WINDOWS_MESA_SHA256 = "{{ vars.windows_mesa_sha256 }}"
LUMYTE_WINDOWS_MESA_ARM64_SHA256 = "{{ vars.windows_mesa_arm64_sha256 }}"

# Official SDK archive; preserve Microsoft's SHA-512 verification.
[tools."http:dotnet"]
version = "10.0.401"
url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/{{ version }}/dotnet-sdk-{{ version }}-linux-{{ arch() }}.tar.gz"
bin_path = "."
[tools."http:dotnet".platforms]
linux-x64 = { checksum = "sha512:51c8b999af9e8dd9998c9edc5944e19a90788862068acd38694e098889054ce8c23d4f0c5cccfa16bf187d044562359e5ee69a9f8ad0bbe913ba90311fbce25b" }
linux-arm64 = { checksum = "sha512:58ace73ced6b4360754689a686bdfb8a317f4da6cb8bb416dbc7d0ba9f47e43e3c09f5eb1f1a1cfaacbd10df9558da4882bf2a5e195d6ab56a02c1f9f76102ed" }
windows-x64 = { url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-win-x64.zip", checksum = "sha512:24b670ad3d923bfcf47df6c3b034152398b42f6dbc388e10d783aee1cfb5e5817d399fc0ae2a12cfa822a55e61d34830ccb15c50ef6efee437ab874bb7c79430" }
windows-arm64 = { url = "https://builds.dotnet.microsoft.com/dotnet/Sdk/10.0.401/dotnet-sdk-10.0.401-win-arm64.zip", checksum = "sha512:8272eaab6f06ad658b1976e19d88beed287a601f968b71d5c26b75d10587cf087665c599d2e136a911002f955c97f59aa8692581bbf6b8e7af5f82604c810256" }

[tools."http:cmake"]
version = "4.4.0"
url = 'https://github.com/Kitware/CMake/releases/download/v{{ version }}/cmake-{{ version }}-linux-{{ arch(x64="x86_64", arm64="aarch64") }}.tar.gz'
bin_path = "bin"
strip_components = 1
[tools."http:cmake".platforms]
linux-x64 = { checksum = "sha256:3864eb649b4466ae126a64bbde1657adad78efbbaa068bf38201de5cf1b5349f" }
linux-arm64 = { checksum = "sha256:e98bb53e0b00a8f672424517d34c05bb9b94fd1c888c89e0b81bc8df51d1a94b" }
windows-x64 = { url = "https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-windows-x86_64.zip", checksum = "sha256:156d70eb7625a7b469444df7d0861d2af8d5d0a437fce32c350372b08f5620e8" }
windows-arm64 = { url = "https://github.com/Kitware/CMake/releases/download/v4.4.0/cmake-4.4.0-windows-arm64.zip", checksum = "sha256:57437e918b2929bbd25b8d427611120149df02d4b216872e0f48f361f03d71e5" }

# Ninja release archives have no publisher checksum manifest. These SHA-256
# values were recorded from the official GitHub release over verified HTTPS.
[tools."http:ninja"]
version = "1.13.2"
bin_path = "."
[tools."http:ninja".platforms]
linux-x64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-linux.zip", checksum = "sha256:5749cbc4e668273514150a80e387a957f933c6ed3f5f11e03fb30955e2bbead6" }
