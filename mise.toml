windows-x64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-win.zip", checksum = "sha256:07fc8261b42b20e71d1720b39068c2e14ffcee6396b76fb7a795fb460b78dc65" }
windows-arm64 = { url = "https://github.com/ninja-build/ninja/releases/download/v1.13.2/ninja-winarm64.zip", checksum = "sha256:e52f0bdef9dfb1003229dbd6508a508c4073fd017247002adc66e5e806cb0391" }

# Shader Slang compiler; GitHub release assets supply SHA-256 digests.
[tools."http:slang"]
version = "2026.19"
bin_path = "bin"
[tools."http:slang".platforms]
linux-x64 = { url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-x86_64-glibc-2.28.tar.gz", checksum = "sha256:bd7afcb0956dee9304f44ed115e9aaa7140704271b5c3294bcb237e3ae67adc7" }
linux-arm64 = { url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-linux-aarch64-glibc-2.28.tar.gz", checksum = "sha256:f49229eb9606b47b122e1d8789be46a7bcd6bb2ffa94b06fae6d544a4e6df637" }
windows-x64 = { url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-windows-x86_64.zip", checksum = "sha256:fc922f214b5d115f663932e59e80e0f6b6cc6fae140979cf307da6459b6f8f33" }
windows-arm64 = { url = "https://github.com/shader-slang/slang/releases/download/v2026.19/slang-2026.19-windows-aarch64.zip", checksum = "sha256:6ddc5a56d22690d2077f91edea884f88f8ea35cba4d2f717fc84bf1c2ded766f" }

[tasks.setup]
description = "Install the shared Linux or Windows development environment"
run = "bash tools/setup/setup.sh"
run_windows = "powershell.exe -NoProfile -File tools/setup/setup.ps1"

[tasks.setup-native]
description = "Prepare pinned vcpkg and the lavapipe ICD"
run = "bash tools/setup/setup-native.sh"
run_windows = "powershell.exe -NoProfile -File tools/setup/setup-native.ps1"

[tasks.verify]
description = "Verify Slang compilation, native NuGet/PInvoke, vcpkg and lavapipe execution"
run = "bash tools/setup/verify.sh"
run_windows = "powershell.exe -NoProfile -File tools/setup/verify.ps1"
